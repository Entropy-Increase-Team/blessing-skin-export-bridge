title: "SkinLoom Export Bridge Configuration"
security_banner: "Security notice: this plugin exposes read-only export endpoints guarded by a short-lived hashed token and optional IP allowlist. Revoke and uninstall it once migration verification succeeds."
http_notice: "This panel is not served over HTTPS. SkinLoom enforces https:// for public domains; plain HTTP is restricted to private networks."
credentials:
  title: "Read-Only Bridge Credentials"
  intro: "Only super-administrators can issue export tokens. Blessing Skin stores only the SHA-256 token hash."
  site_url: "Bridge URL"
  status_label: "Credential status"
  status_fresh: "Newly generated (shown once)"
  status_active: "Active (hashed)"
  status_expired: "Expired — generate a new token"
  status_inactive: "Inactive"
  expires_at: "Expires at :time"
  storage_driver: "Active textures disk driver: :driver (read seamlessly via Storage::disk('textures'))"
  token_label: "Bearer Token (256-bit)"
  once_warning: "This plaintext token is shown only once. Generate a replacement if you leave this page without copying it."
  bundle_label: "One-click Connection Bundle (JSON)"
  bundle_hint: "Paste this bundle directly into the SkinLoom Setup Wizard Bridge URL field to autofill both URL and token."
  hashed_hint: "An active hashed token exists. To obtain a new plaintext copy, rotate the token below."
actions:
  generate: "Generate 256-bit Read-Only Token"
  rotate: "Rotate Token (Invalidate Previous)"
  revoke: "Revoke Token & Unfreeze"
  copy: "Copy"
  copy_bundle: "Copy bundle"
  copied: "Copied"
settings:
  title: "Security & Export Controls"
  ttl:
    title: "Token lifetime"
    h1: "1 hour"
    h6: "6 hours"
    h24: "24 hours (recommended)"
    h72: "72 hours"
    h168: "7 days"
    hint: "Once expired, bridge APIs and write-freeze mode stop automatically."
  ip_allowlist:
    title: "Allowed SkinLoom IP / CIDR Allowlist (optional)"
    description: "Leave empty to allow any source IP, or list IPs/CIDRs separated by commas or newlines (e.g. 203.0.113.10, 10.0.0.0/8)."
  freeze_writes:
    title: "Write-Freeze Window"
    label: "Freeze public writes during cutover (registration, password change, player edits, texture uploads)"
    description: "Keeps Blessing Skin consistent during final migration without running artisan down; admin panel and bridge reads stay reachable."
  export_sensitive:
    title: "Sensitive Secrets Transfer"
    label: "Include ygg_private_key and OAuth client secrets (recommended)"
    description: "Keeps game servers and OAuth clients seamless across cutover. Uncheck if you prefer rotating secrets on SkinLoom."
messages:
  token_generated: "Generated a new read-only bridge token valid for :hours hour(s). Copy it now; it will not be shown again."
  token_revoked: "Bridge token revoked and write-freeze disabled."
  invalid_cidr: "Invalid IP or CIDR entry in allowlist: :entry"
