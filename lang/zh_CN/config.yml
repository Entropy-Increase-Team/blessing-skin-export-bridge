title: "SkinLoom 迁移桥接配置"
security_banner: "安全提醒：本插件仅提供只读导出端点并支持短时效令牌与 IP 白名单。迁移核对完成后，请立即撤销令牌并禁用卸载本插件。"
http_notice: "当前页面未使用 HTTPS。SkinLoom 对公网域名强制校验 HTTPS，仅在私有局域网或本机调试时可在 SkinLoom 向导中开启可信内网 HTTP。"
credentials:
  title: "只读桥接凭证"
  intro: "仅超级管理员可签发导出令牌。数据库中仅保存 SHA-256 哈希，不持久化明文密钥。"
  site_url: "旧站地址（Bridge URL）"
  status_label: "凭证状态"
  status_fresh: "新令牌已生成（仅本次显示）"
  status_active: "已激活（哈希存储）"
  status_expired: "已过期，请重新生成"
  status_inactive: "未配置"
  expires_at: "有效期至 :time"
  storage_driver: "当前材质存储驱动：:driver（通过 Storage::disk('textures') 透明读取）"
  token_label: "桥接 Bearer 令牌（256-bit）"
  once_warning: "出于安全考虑，明文令牌仅显示这一次。刷新或离开本页后需点击“轮换令牌”重新签发。"
  bundle_label: "一键粘贴连接串（JSON）"
  bundle_hint: "可直接复制下方 JSON 整串，粘贴到 SkinLoom 安装向导的“旧站地址”输入框中自动填入。"
  hashed_hint: "当前已有生效中的导出令牌（仅保存 SHA-256 哈希，无法再次查看明文）。若丢失请点击下方“重新生成新令牌”。"
actions:
  generate: "生成 256-bit 只读令牌"
  rotate: "轮换令牌（立即作废旧令牌）"
  revoke: "立即撤销令牌并解除冻结"
  copy: "复制"
  copy_bundle: "复制连接串"
  copied: "已复制"
settings:
  title: "安全与导出选项"
  ttl:
    title: "令牌有效期"
    h1: "1 小时"
    h6: "6 小时"
    h24: "24 小时（推荐）"
    h72: "72 小时"
    h168: "7 天"
    hint: "过期后所有导出 API 与写冻结开关将自动失效。"
  ip_allowlist:
    title: "允许的 SkinLoom IP / CIDR 白名单（可选）"
    description: "留空则不限制来源 IP；支持多行或逗号分隔，例如 203.0.113.10 或 10.0.0.0/8。若部署在反代后请启用 trust-proxies 插件。"
  freeze_writes:
    title: "迁移期间写入保护"
    label: "开启“写入冻结”（阻止前台注册、改密、创建角色、上传/删除材质）"
    description: "建议在执行最终同步切换前开启，保证两边数据严格一致；管理员操作与桥接读取不受影响。"
  export_sensitive:
    title: "迁移签名与 OAuth 密钥"
    label: "包含 ygg_private_key 与 OAuth 应用 Secret（推荐）"
    description: "勾选后原 Yggdrasil 公钥和第三方 OAuth 应用无需重置即可无缝切换；取消勾选则导入端将重新生成密钥。"
messages:
  token_generated: "已生成新的只读桥接令牌，有效期 :hours 小时。请立即复制并勿泄露给他人。"
  token_revoked: "导出令牌已撤销，写入冻结已解除。"
  invalid_cidr: "IP 白名单条目格式无效：:entry"
